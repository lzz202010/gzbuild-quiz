<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-label="正方形 ABCD，E、F 分别为 AB、AD 中点，DE 与 BF 交于 O，阴影为四边形 BCDO">
  <rect width="360" height="380" fill="#fff"/>
  <g transform="translate(50,40)">
    <path d="M0 0 H240 V240 H0 Z" fill="none" stroke="#1e2628" stroke-width="2"/>
    <path d="M0 0 L120 240 M0 120 L240 0" fill="none" stroke="#1e2628" stroke-width="2"/>
    <path d="M80 80 L240 0 L240 240 L0 240 Z" fill="#e9e2d4" opacity=".8"/>
    <g stroke="#1e2628" stroke-width="1" opacity=".55">
      <path d="M80 80 L240 0"/><path d="M80 80 L240 240"/><path d="M80 80 L0 240"/>
    </g>
    <circle cx="80" cy="80" r="3.5" fill="#9b2c2c"/>
  </g>
  <g font-family="Songti SC, SimSun, serif" font-size="18" fill="#1e2628">
    <text x="38" y="36">A</text><text x="296" y="36">D</text><text x="296" y="300">C</text><text x="38" y="300">B</text>
    <text x="38" y="170">E</text><text x="160" y="28">F</text><text x="120" y="132">O</text>
  </g>
</svg>
